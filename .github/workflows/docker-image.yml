name: Build and Publish Docker Image

# Pull requests and pushes run the tests. A push to main whose commits call for a new version
# (ci/next_release.sh) builds the image, boots it on every Steam branch of the game and publishes it
# under that version once it boots on the stable game. The image holds no game, so every hour the
# newest release is booted on each branch whose Steam build is new to it. Every boot test that
# passes adds the env reference for its game build to the docs site, and a boot test whose canary
# says that the game no longer needs a workaround opens or updates an issue for it.
on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'shim/**'
      - 'smoke/**'
      - 'version/**'
      - 'ci/**'
      - 'site/**'
      - 'Dockerfile'
      - '.github/workflows/docker-image.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'shim/**'
      - 'smoke/**'
      - 'version/**'
      - 'ci/**'
      - 'site/**'
      - 'Dockerfile'
      - '.github/workflows/docker-image.yml'
  schedule:
    - cron: "17 1-23 * * *" # hourly
    - cron: "17 0 * * *" # daily, which also retries builds that failed
  workflow_dispatch:

# Pull request runs replace each other. Pushes queue, since each may release a version, and the
# checks queue apart from them, so a check never cancels a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'push' && 'release' || 'check' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Lint scripts
        run: shellcheck -x -S warning scripts/*.sh scripts/lib/*.sh smoke/*.sh ci/*.sh

      - name: Run smoke tests
        run: bash smoke/run_smoke.sh

  prepare:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
      actions: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_tests: ${{ steps.plan.outputs.has_tests }}
      branches: ${{ steps.plan.outputs.branches }}
      release: ${{ steps.plan.outputs.release }}
      publish: ${{ steps.plan.outputs.publish }}
      notes: ${{ steps.plan.outputs.notes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Decide what to test
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          HOURLY: ${{ github.event.schedule == '17 1-23 * * *' }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          version=""
          if [ "${GITHUB_EVENT_NAME}" = push ]; then
            version="$(bash ci/next_release.sh "${RUNNER_TEMP}/notes.md")"
          fi
          release="${version}"
          if [ -z "${release}" ]; then
            release="$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n 1)"
            release="${release#v}"
          fi

          # A new version is tested on every branch, the newest release on branches without a
          # reference made with it. Hourly runs skip a build that already failed with that release.
          branches="$(bash ci/game_branches.sh)"
          tested="$(curl -fsS "${SITE_URL}/env/index.json" | jq -r '.files[] | "\(.file) \(.release // "")"' || true)"
          failed="$(gh api "repos/${GITHUB_REPOSITORY}/actions/caches?key=boot-failed-&per_page=100" --jq '.actions_caches[].key')"
          tests=()
          while read -r branch build; do
            [ -n "${release}" ] || break
            marked=false
            grep -qxF "boot-failed-${branch}-${build}-${release}" <<< "${failed}" && marked=true
            if [ -z "${version}" ]; then
              grep -qxF "${branch}-${build}.json ${release}" <<< "${tested}" && continue
              if [ "${marked}" = true ] && [ "${HOURLY}" = true ]; then
                echo "Skipping ${branch} build ${build}: it failed with ${release} before, the daily run retries it"
                continue
              fi
            fi
            tests+=("$(jq -n -c --arg branch "${branch}" --arg build "${build}" --argjson marked "${marked}" '{$branch, $build, $marked}')")
          done <<< "${branches}"

          echo "Steam builds: $(paste -sd ' ' <<< "${branches}"); new version: ${version:-none}; release tested: ${release:-none}"
          echo "Testing: $(printf '%s\n' "${tests[@]}" | jq -r -s 'map(.branch) | join(" ")')"
          {
            echo "matrix=$(printf '%s\n' "${tests[@]}" | jq -s -c .)"
            echo "has_tests=$([ "${#tests[@]}" -gt 0 ] && echo true || echo false)"
            echo "branches=$(cut -d' ' -f1 <<< "${branches}" | paste -sd ' ')"
            echo "release=${release}"
            echo "publish=$([ -n "${version}" ] && echo true || echo false)"
            if [ -n "${version}" ]; then
              delimiter="notes-$(openssl rand -hex 8)"
              echo "notes<<${delimiter}"
              cat "${RUNNER_TEMP}/notes.md"
              echo "${delimiter}"
            fi
          } >> "$GITHUB_OUTPUT"

  build:
    name: Boot test on ${{ matrix.branch }}
    needs: prepare
    if: needs.prepare.outputs.has_tests == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      LOCAL_IMAGE: pz-server:candidate
      RELEASE: ${{ needs.prepare.outputs.release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: needs.prepare.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build image
        if: needs.prepare.outputs.publish == 'true'
        run: |
          docker buildx build \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --label org.opencontainers.image.version="${RELEASE}" \
            --tag "${LOCAL_IMAGE}" \
            --load \
            .

      - name: Pull the release
        if: needs.prepare.outputs.publish != 'true'
        run: |
          docker pull "ghcr.io/${GITHUB_REPOSITORY,,}:${RELEASE}"
          docker tag "ghcr.io/${GITHUB_REPOSITORY,,}:${RELEASE}" "${LOCAL_IMAGE}"

      - name: Boot test
        id: boot
        run: bash ci/boot_test.sh "${LOCAL_IMAGE}" "${{ matrix.branch }}" out

      # A game update can change the install layout the scripts rely on.
      - name: Show the game install
        if: failure() && steps.boot.outcome == 'failure'
        run: |
          docker run --rm -v pz-boot-game:/home/steam/pz-dedicated --entrypoint bash "${LOCAL_IMAGE}" -c '
            id; echo "STEAMAPPDIR=${STEAMAPPDIR}"
            ls -la /home/steam "${STEAMAPPDIR}" "${STEAMAPPDIR}/steamapps"
            ls -laL "${STEAMAPPDIR}/start-server.sh"
            head -c 300 "${STEAMAPPDIR}/start-server.sh" | od -c | head -n 12'

      # The cache entry only marks the failure for the next runs; its content doesn't matter.
      - name: Mark the failed build
        if: failure() && steps.boot.outcome == 'failure' && !matrix.marked
        run: mkdir -p boot-failed && echo "${GITHUB_RUN_ID}" > boot-failed/run

      - name: Save the failure mark
        if: failure() && steps.boot.outcome == 'failure' && !matrix.marked
        uses: actions/cache/save@v6
        with:
          path: boot-failed
          key: boot-failed-${{ matrix.branch }}-${{ matrix.build }}-${{ needs.prepare.outputs.release }}

      - name: Publish the release
        if: needs.prepare.outputs.publish == 'true' && matrix.branch == 'public'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ needs.prepare.outputs.notes }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          IFS=. read -r major minor _ <<< "${RELEASE}"
          for tag in "${RELEASE}" "${major}.${minor}" "${major}" latest; do
            docker tag "${LOCAL_IMAGE}" "${image}:${tag}"
            docker push "${image}:${tag}"
          done
          printf '%s\n' "${NOTES}" > "${RUNNER_TEMP}/notes.md"
          gh release create "v${RELEASE}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
            --title "v${RELEASE}" --notes-file "${RUNNER_TEMP}/notes.md"

      - name: Upload env reference
        uses: actions/upload-artifact@v7
        with:
          name: env-${{ matrix.branch }}
          path: out/*.json
          if-no-files-found: error

      # A canary's result holds even when a later part of the boot test fails. Last, so that a failed
      # upload doesn't hold back the release.
      - name: Upload canary results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: canaries-${{ matrix.branch }}
          path: out/canaries.jsonl
          if-no-files-found: ignore
          overwrite: true

  # References only exist for boot tests that passed, so a failed branch leaves the site as it was.
  pages:
    needs: [test, prepare, build]
    if: >-
      always() && github.ref == 'refs/heads/main' && needs.test.result == 'success'
      && (github.event_name == 'push' || (needs.prepare.outputs.has_tests == 'true' && needs.build.result != 'cancelled'))
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download env references
        uses: actions/download-artifact@v8
        with:
          pattern: env-*
          merge-multiple: true
          path: _site/env

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Assemble site
        run: bash ci/build_site.sh _site "${{ steps.pages.outputs.base_url }}"

      # A re-run keeps the artifacts of earlier attempts, and deploy-pages refuses two with one name.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  # Runs that test the real game on main turn fired canaries into issues.
  canaries:
    needs: [prepare, build]
    if: >-
      always() && github.ref == 'refs/heads/main'
      && needs.prepare.outputs.has_tests == 'true' && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    concurrency:
      group: canaries
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download canary results
        uses: actions/download-artifact@v8
        with:
          pattern: canaries-*
          path: canaries

      - name: Open or update issues
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCHES: ${{ needs.prepare.outputs.branches }}
        run: bash ci/canary_issues.sh canaries

  # GitHub turns off the schedule of a public repository after 60 days without activity, and
  # enabling the workflow counts as activity.
  keepalive:
    if: github.event.schedule == '17 0 * * *'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep the schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/docker-image.yml/enable"
