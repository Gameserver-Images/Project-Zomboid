services:
  ProjectZomboidDedicatedServer:
    image: ghcr.io/gameserver-images/project-zomboid:1
    restart: unless-stopped
    # Saving a large world on shutdown takes longer than Docker's default 10s.
    stop_grace_period: 120s
    build:
      context: .
      args:
        - EXTRA_LOCALES=${EXTRA_LOCALES:-}
    env_file:
      - .env
    # A start logs about 5 MB, and Docker keeps everything by default.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "16261:16261/udp"
      - "16262:16262/udp"
      - "27015:27015/tcp"
    volumes:
      # The container runs as uid 1000; bind-mounted folders must be writable by it.
      - ./data:/home/steam/Zomboid
      - ./game:/home/steam/pz-dedicated
